name = "anjaneyadecorations-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# One shared worker config. If you want separate dev/staging/prod databases,
# duplicate the [[d1_databases]] block under [env.staging] / [env.production].
[[d1_databases]]
binding = "DB"
database_name = "anjaneya-db"
database_id = "5a42f2a7-272a-4e10-8aee-1035ee242a97"

[vars]
# Comma-separated list of origins allowed to call this API (your Pages URL).
# Use "*" while testing, then lock it down once you know your pages.dev / custom domain.
ALLOWED_ORIGINS = "*"
